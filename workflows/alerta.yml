name: Alerta

on:
  push:
    branches:
      - main

jobs:
  hola-mundo:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        
      - name: Ejecutar Hola Mundo
        run: node index.js
        
      - name: Enviar notificación a ntfy
        run: |
          curl -d "Nuevo codigo subido a la rama main" https://ntfy.sh/devops-itla
